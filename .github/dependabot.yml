version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # python base image sabit tutulur; major/minor yukseltmeleri elle yapilir
      # (torch / sentence-transformers wheel uyumu icin)
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
