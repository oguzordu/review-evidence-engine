services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: review_evidence
      POSTGRES_PASSWORD: review_evidence
      POSTGRES_DB: review_evidence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_evidence"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://review_evidence:review_evidence@db:5432/review_evidence
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
